name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: movieuser
          POSTGRES_PASSWORD: moviepassword
          POSTGRES_DB: moviedb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movieuser -d moviedb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run database migrations
        env:
          POSTGRES_USER: movieuser
          POSTGRES_PASSWORD: moviepassword
          POSTGRES_DB: moviedb
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          alembic upgrade head

      - name: Run tests
        env:
          POSTGRES_USER: movieuser
          POSTGRES_PASSWORD: moviepassword
          POSTGRES_DB: moviedb
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ap-south-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/movie-api:${{ github.sha }} \
            .

      - name: Push image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/movie-api:${{ github.sha }}

  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.JWT_SECRET }}
      ALGORITHM: HS256

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: movieuser
          POSTGRES_PASSWORD: moviepassword
          POSTGRES_DB: moviedb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U movieuser -d moviedb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          POSTGRES_USER: movieuser
          POSTGRES_PASSWORD: moviepassword
          POSTGRES_DB: moviedb
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: python -m alembic upgrade head

      - name: Run tests
        env:
          POSTGRES_USER: movieuser
          POSTGRES_PASSWORD: moviepassword
          POSTGRES_DB: moviedb
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: pytest